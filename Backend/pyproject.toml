[project]
name = "healthstride-backend"
version = "0.1.0"
description = "HealthStride API foundation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15.0",
    "asyncpg>=0.30.0",
    "fastapi[standard]>=0.115.0",
    "firebase-admin>=6.6.0",
    "pydantic-settings>=2.7.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"tests/test_health.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true

[tool.pytest.ini_options]
pythonpath = ["."]
